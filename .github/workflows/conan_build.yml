name: C++ Conan Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Conan
      # This automatically detects the profile
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Install Dependencies
      # This generates the conan_toolchain.cmake and build presets
      run: |
        conan install . --build=missing -s build_type=Release -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config"

    - name: Configure CMake
      # Using the toolchain file generated by Conan
      run: |
        cmake -B build -S . \
          -G "Ninja Multi-Config" \
          -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure
      
    - name: Clean old Conan cache entries
      run: |
        conan cache clean "*" --source --build --temp
        conan remove "*" --lru=4w --confirm      